[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vci-audit"
version = "0.1.0"
description = "Verification Coverage Index audit harness for open-ended RL tasks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["vci", "vci.families"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

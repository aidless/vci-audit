name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Pinned, not ubuntu-latest: ubuntu-latest is 26.04, and actions/python-versions
    # publishes 3.9 builds only for 22.04 and 24.04, so setup-python fails there.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject.toml (requires-python = ">=3.9"),
        # 3.12 is the current stable. Two points are enough to keep the claim honest.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The package has no runtime dependencies (pyproject: dependencies = []).
      # The only install is pytest, pulled in by the "dev" extra.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest
